<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="500" viewBox="0 0 1200 500" role="img" aria-labelledby="title desc"><title id="title">Fields of work</title><desc id="desc">Two by two grid of work areas with roomy typography.</desc><rect width="1200" height="500" rx="22" fill="#0B131C"/><rect x="1" y="1" width="1198" height="498" rx="21" fill="none" stroke="#213247"/><g transform="translate(42 38)"><text x="0" y="0" dominant-baseline="hanging" fill="#8294A8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">FIELDS OF WORK</text><text x="0" y="54" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760">What I usually build around</text><g transform="translate(0 108)"><g><rect width="548" height="142" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">01  EMBEDDED SYSTEMS</text><text x="26" y="68" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="730">Software close to the hardware</text><text x="26" y="102" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Sensors, device logic, serial buses, control loops and integration.</text><text x="26" y="126" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">The fun part is where the physical world stops being theoretical.</text></g><g transform="translate(568 0)"><rect width="548" height="142" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">02  IOT + TELEMETRY</text><text x="26" y="68" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="730">Connected systems with visible state</text><text x="26" y="102" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Remote nodes, device state, realtime data and observability.</text><text x="26" y="126" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">I care more about useful signals than impressive dashboards.</text></g><g transform="translate(0 164)"><rect width="548" height="142" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">03  BACKEND + LINUX</text><text x="26" y="68" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="730">Services that keep doing their job</text><text x="26" y="102" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">APIs, workers, automation, monitoring, deployment and recovery paths.</text><text x="26" y="126" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Operational behavior matters as much as the happy path.</text></g><g transform="translate(568 164)"><rect width="548" height="142" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">04  INTERFACES + CONTROL</text><text x="26" y="68" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="30" font-weight="730">Human readable complexity</text><text x="26" y="102" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Web apps, operator views, control surfaces and useful feedback.</text><text x="26" y="126" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">A good interface should make the system easier to reason about.</text></g></g></g></svg>