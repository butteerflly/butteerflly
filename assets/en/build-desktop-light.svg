<svg xmlns="http://www.w3.org/2000/svg" width="900" height="270" viewBox="0 0 900 270" xml:lang="en" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">How I like to build</title>
  <desc id="desc">01 Make state observable Use logs, metrics and clear signals to understand system behavior. 02 Test when things fail Check timing, retries and lost connections. 03 Make recovery practical Leave useful logs and a way to roll back changes.</desc>
  <text x="32" y="46" font-size="16" fill="#89603F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">01</text>
  <text x="78" y="46" font-size="23" fill="#242D30" font-weight="600">Make state observable</text>
  <text x="78" y="78" font-size="19" fill="#536367" font-weight="400">Use logs, metrics and clear signals to understand system behavior.</text>
  <path d="M78 92H868" fill="none" stroke="#CDD8D6" />
  <text x="32" y="132" font-size="16" fill="#89603F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">02</text>
  <text x="78" y="132" font-size="23" fill="#242D30" font-weight="600">Test when things fail</text>
  <text x="78" y="164" font-size="19" fill="#536367" font-weight="400">Check timing, retries and lost connections.</text>
  <path d="M78 178H868" fill="none" stroke="#CDD8D6" />
  <text x="32" y="218" font-size="16" fill="#89603F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">03</text>
  <text x="78" y="218" font-size="23" fill="#242D30" font-weight="600">Make recovery practical</text>
  <text x="78" y="250" font-size="19" fill="#536367" font-weight="400">Leave useful logs and a way to roll back changes.</text>
</svg>
