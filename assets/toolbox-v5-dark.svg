<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="470" viewBox="0 0 1200 470" role="img" aria-labelledby="title desc"><title id="title">Engineering toolbox</title><desc id="desc">Grouped technologies in a two by two grid.</desc><rect width="1200" height="470" rx="22" fill="#0B131C"/><rect x="1" y="1" width="1198" height="468" rx="21" fill="none" stroke="#213247"/><g transform="translate(42 38)"><text x="0" y="0" dominant-baseline="hanging" fill="#8294A8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">TOOLBOX</text><text x="0" y="54" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760">The stack changes with the problem</text><g transform="translate(0 108)"><g><rect width="548" height="132" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">SYSTEMS + BACKEND</text><text x="26" y="66" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">Go  ·  C#  ·  .NET  ·  Node.js</text><text x="26" y="97" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">APIs, workers, services, transport, state and automation.</text></g><g transform="translate(568 0)"><rect width="548" height="132" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">FRONTEND + INTERFACES</text><text x="26" y="66" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">TypeScript  ·  React  ·  Vite</text><text x="26" y="97" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Dashboards, operator views and practical web tooling.</text></g><g transform="translate(0 154)"><rect width="548" height="132" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="30" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">EMBEDDED + IOT</text><text x="26" y="66" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">ESP32  ·  UART  ·  I²C  ·  OTA</text><text x="26" y="97" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Firmware, sensors, field behavior and device integration.</text></g><g transform="translate(568 154)"><rect width="548" height="132" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="28" fill="#39E2CA" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.3">INFRA + OPS</text><text x="26" y="60" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="720">Linux  ·  Docker  ·  Prometheus</text><text x="26" y="88" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="25" font-weight="720">GitHub Actions  ·  Tailscale</text><text x="26" y="116" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15.5">Observability, delivery, networking and recovery friendly operations.</text></g></g></g></svg>