<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="420" viewBox="0 0 1200 420" role="img" aria-labelledby="title desc">
<title id="title">ButterFlly profile header</title><desc id="desc">Software, systems, IoT, infrastructure and automation.</desc>
<defs>
  <pattern id="grid" width="28" height="28" patternUnits="userSpaceOnUse"><path d="M28 0H0V28" fill="none" stroke="#E5EBF2" stroke-width="1"/></pattern>
  <linearGradient id="accent" x1="0" x2="1"><stop stop-color="#008F82"/><stop offset="1" stop-color="#5566D9"/></linearGradient>
  <radialGradient id="halo"><stop stop-color="#BFEDE8" stop-opacity=".75"/><stop offset="1" stop-color="#BFEDE8" stop-opacity="0"/></radialGradient>
  <filter id="blur"><feGaussianBlur stdDeviation="18"/></filter>
  <style>
    .pulse{animation:pulse 2.4s ease-in-out infinite} .p2{animation-delay:.8s} .p3{animation-delay:1.6s}
    .scan{animation:scan 7s linear infinite} .blink{animation:blink 1.8s steps(2,end) infinite}
    @keyframes pulse{0%,100%{opacity:.25}50%{opacity:1}} @keyframes blink{50%{opacity:.25}}
    @keyframes scan{0%{transform:translateX(-260px)}100%{transform:translateX(1200px)}}
  </style>
</defs>
<rect width="1200" height="420" rx="24" fill="#F7F9FC"/>
<rect x="1" y="1" width="1198" height="418" rx="23" fill="none" stroke="#D8E1EB"/>
<rect width="1200" height="420" rx="24" fill="url(#grid)" opacity=".74"/>
<circle cx="962" cy="181" r="196" fill="url(#halo)" filter="url(#blur)" opacity=".75"/>
<g class="scan" opacity=".16"><rect x="0" y="0" width="160" height="420" fill="url(#accent)"/></g>

<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <text x="54" y="48" fill="#617083" font-size="12" letter-spacing="2.5">PROFILE / ENGINEERING SYSTEMS</text>
  <text x="1125" y="48" text-anchor="end" fill="#617083" font-size="11" letter-spacing="1.7">BUILDING THINGS THAT TALK TO OTHER THINGS</text>
</g>

<g transform="translate(54 88)">
  <rect width="604" height="208" rx="18" fill="#FFFFFF" stroke="#D8E1EB"/>
  <rect x="0" y="0" width="7" height="208" rx="3" fill="url(#accent)"/>
  <text x="30" y="62" fill="#17202B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="68" font-weight="800" letter-spacing="-3.2">BUTTERFLLY</text>
  <text x="33" y="98" fill="#008F82" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="1.7">SOFTWARE  ·  SYSTEMS  ·  IoT  ·  INFRASTRUCTURE</text>
  <text x="33" y="135" fill="#17202B" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">Most projects live somewhere between a browser,</text>
  <text x="33" y="159" fill="#17202B" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">a Linux box and a real piece of hardware.</text>
  <g transform="translate(32 178)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <circle cx="6" cy="6" r="5" fill="#208A62" class="blink"/>
    <text x="20" y="10" fill="#617083" font-size="11" letter-spacing="1.2">CURRENT FOCUS</text>
    <text x="126" y="10" fill="#17202B" font-size="11">HOME IOT / CONTROL SYSTEMS</text>
  </g>
</g>

<g transform="translate(710 84)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <circle cx="207" cy="122" r="114" fill="#FFFFFF" stroke="#D8E1EB"/>
  <circle cx="207" cy="122" r="82" fill="none" stroke="#D8E1EB" stroke-dasharray="4 8"/>
  <circle cx="207" cy="122" r="48" fill="#F1F5F9" stroke="#008F82" stroke-width="1.5"/>
  <text x="207" y="116" text-anchor="middle" fill="#008F82" font-size="10" letter-spacing="1.4">CONTROL</text>
  <text x="207" y="136" text-anchor="middle" fill="#17202B" font-size="14" font-weight="700">PLANE</text>
  <circle cx="207" cy="40" r="6" fill="#008F82" class="pulse"/><circle cx="289" cy="122" r="6" fill="#5566D9" class="pulse p2"/><circle cx="207" cy="204" r="6" fill="#208A62" class="pulse p3"/><circle cx="125" cy="122" r="6" fill="#008F82" class="pulse p2"/>
  <path d="M207 74V46M255 122h28M207 170v28M159 122h-28" stroke="#D8E1EB" stroke-width="2"/>
  <text x="207" y="18" text-anchor="middle" fill="#617083" font-size="10" letter-spacing="1">WEB / UI</text>
  <text x="351" y="126" fill="#617083" font-size="10" letter-spacing="1">LINUX</text>
  <text x="207" y="242" text-anchor="middle" fill="#617083" font-size="10" letter-spacing="1">ESP32</text>
  <text x="54" y="126" fill="#617083" font-size="10" letter-spacing="1">PC AGENT</text>
</g>

<g transform="translate(54 326)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
  <g transform="translate(0 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">MODE</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">BUILD + BREAK + FIX</text></g><g transform="translate(188 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">STACK</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">WEB TO HARDWARE</text></g><g transform="translate(376 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">SIGNAL</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">REALTIME</text></g><g transform="translate(564 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">OPS</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">OBSERVABLE</text></g><g transform="translate(752 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">RECOVERY</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">ALWAYS HAVE A WAY BACK</text></g><g transform="translate(940 0)"><rect width="172" height="48" rx="12" fill="#FFFFFF" stroke="#D8E1EB"/><text x="14" y="20" fill="#617083" font-size="9" letter-spacing="1.2">LOCATION</text><text x="14" y="36" fill="#17202B" font-size="11" font-weight="700">SOMEWHERE IN NEW MEXICO</text></g>
</g>
</svg>