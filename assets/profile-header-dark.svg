<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
<title id="title">ButterFlly — Software, Systems, IoT and Automation</title>
<desc id="desc">Engineering profile banner with a control-plane systems diagram.</desc>
<defs>
