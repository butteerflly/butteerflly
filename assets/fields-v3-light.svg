<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="360" viewBox="0 0 1200 360" role="img" aria-labelledby="title desc">
  <title id="title">Fields of work</title>
  <desc id="desc">Four main fields of work with a small interaction diagram.</desc>
  <rect width="1200" height="360" rx="20" fill="#FFFFFF"/>
  <rect x="1" y="1" width="1198" height="358" rx="19" fill="none" stroke="#D0D7DE"/>
  <text x="52" y="54" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">FIELDS OF WORK</text>
  <text x="52" y="108" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="42" font-weight="760" letter-spacing="-1.2">What I usually build around</text>
  <text x="52" y="144" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="1.2">PRIVATE WORK  ·  SYSTEMS  ·  OPERATIONS  ·  DEVICE LAYER</text>
  <g transform="translate(52 184)">
    <g><rect width="250" height="118" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="28" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.2">01</text><text x="20" y="56" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Embedded systems</text><text x="20" y="84" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Sensors, device logic, serial buses,</text><text x="20" y="103" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">control loops and integration.</text></g>
    <g transform="translate(270 0)"><rect width="250" height="118" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="28" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.2">02</text><text x="20" y="56" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">IoT and telemetry</text><text x="20" y="84" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Remote nodes, device state,</text><text x="20" y="103" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">realtime data and observability.</text></g>
    <g transform="translate(540 0)"><rect width="250" height="118" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="28" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.2">03</text><text x="20" y="56" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Backend and Linux</text><text x="20" y="84" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Services, APIs, automation,</text><text x="20" y="103" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">monitoring and operations.</text></g>
    <g transform="translate(810 0)"><rect width="286" height="118" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="28" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.2">04</text><text x="20" y="56" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="26" font-weight="700">Interfaces and control</text><text x="20" y="84" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Operator views, web apps, status panels</text><text x="20" y="103" fill="#57606A" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">and the human side of complex systems.</text></g>
  </g>
</svg>
