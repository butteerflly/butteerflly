<svg xmlns="http://www.w3.org/2000/svg" width="900" height="416" viewBox="0 0 900 416" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">How I like to build</title>
  <desc id="desc">01 / DEFINE Start with the boundaries Define contracts and ownership. Make state transitions explicit. 02 / OBSERVE Leave useful evidence Log the context that explains a failure. Measure behavior under real use. 03 / VERIFY Test the awkward cases Check timing, retries and lost connections. Make failures reproducible. 04 / RECOVER Keep a way back Plan rollback before deployment. Exercise recovery before it is needed.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#007D6C"/><stop offset="1" stop-color="#536DDA"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .flow { animation: flow 12s linear infinite; }
    }
    @keyframes pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
  <rect x="0.5" y="0.5" width="899" height="415" rx="16" fill="#F7F9FC" stroke="#CCD6E0"/>
  <text x="32" y="56" font-size="16" fill="#007D6C" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">01 / DEFINE</text>
  <text x="32" y="90" font-size="23" fill="#151B23" font-weight="600">Start with the boundaries</text>
  <text x="466" y="59" font-size="19" fill="#526171" font-weight="400">Define contracts and ownership.</text>
  <text x="466" y="87" font-size="19" fill="#526171" font-weight="400">Make state transitions explicit.</text>
  <path d="M32 108H868" fill="none" stroke="#CCD6E0" />
  <text x="32" y="144" font-size="16" fill="#007D6C" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">02 / OBSERVE</text>
  <text x="32" y="178" font-size="23" fill="#151B23" font-weight="600">Leave useful evidence</text>
  <text x="466" y="147" font-size="19" fill="#526171" font-weight="400">Log the context that explains a failure.</text>
  <text x="466" y="175" font-size="19" fill="#526171" font-weight="400">Measure behavior under real use.</text>
  <path d="M32 196H868" fill="none" stroke="#CCD6E0" />
  <text x="32" y="232" font-size="16" fill="#007D6C" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">03 / VERIFY</text>
  <text x="32" y="266" font-size="23" fill="#151B23" font-weight="600">Test the awkward cases</text>
  <text x="466" y="235" font-size="19" fill="#526171" font-weight="400">Check timing, retries and lost connections.</text>
  <text x="466" y="263" font-size="19" fill="#526171" font-weight="400">Make failures reproducible.</text>
  <path d="M32 284H868" fill="none" stroke="#CCD6E0" />
  <text x="32" y="320" font-size="16" fill="#007D6C" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">04 / RECOVER</text>
  <text x="32" y="354" font-size="23" fill="#151B23" font-weight="600">Keep a way back</text>
  <text x="466" y="323" font-size="19" fill="#526171" font-weight="400">Plan rollback before deployment.</text>
  <text x="466" y="351" font-size="19" fill="#526171" font-weight="400">Exercise recovery before it is needed.</text>
</svg>
