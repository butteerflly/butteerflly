<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="320" viewBox="0 0 1200 320" role="img" aria-labelledby="title desc">
  <title id="title">ButterFlly profile header</title>
  <desc id="desc">Software, systems, embedded, IoT and automation profile header.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse">
      <path d="M32 0H0V32" fill="none" stroke="#17212B" stroke-width="1"/>
    </pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#45E6D2"/>
      <stop offset="1" stop-color="#7C93FF"/>
    </linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%">
      <feGaussianBlur stdDeviation="14"/>
    </filter>
  </defs>
  <rect width="1200" height="320" rx="24" fill="#0B1016"/>
  <rect x="1" y="1" width="1198" height="318" rx="23" fill="none" stroke="#222E3A"/>
  <rect width="1200" height="320" rx="24" fill="url(#grid)" opacity="0.72"/>
  <circle cx="943" cy="160" r="112" fill="#163E3C" opacity="0.52" filter="url(#glow)"/>
  <text x="60" y="56" fill="#8E9AA8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="2.4">BUTTERFLLY / SYSTEM PROFILE</text>
  <rect x="60" y="75" width="110" height="3" rx="2" fill="url(#line)"/>
  <text x="58" y="138" fill="#F3F6F8" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="770" letter-spacing="-2.8">BUTTERFLLY</text>
  <text x="60" y="178" fill="#9CA8B6" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" letter-spacing="1.5">SOFTWARE  ·  SYSTEMS  ·  EMBEDDED  ·  IOT  ·  AUTOMATION</text>
  <text x="60" y="219" fill="#EAF0F5" opacity="0.9" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">I build software that connects services, infrastructure, devices and real world systems.</text>
  <g transform="translate(60 247)">
