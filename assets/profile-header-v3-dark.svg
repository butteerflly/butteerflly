      <text x="36" y="44" fill="#8E9AA8" font-size="10">operator views</text>
    </g>
    <g transform="translate(984 70)">
      <rect width="156" height="50" rx="13" fill="#121A23" stroke="#24313F"/>
      <circle cx="20" cy="25" r="5" fill="#45E6D2"/>
      <text x="36" y="30" fill="#F3F6F8" font-size="13">LINUX NODES</text>
      <text x="36" y="44" fill="#8E9AA8" font-size="10">services and ops</text>
    </g>
    <g transform="translate(732 202)">
