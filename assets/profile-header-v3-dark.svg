  </g>
  <text x="227" y="268" fill="#F3F6F8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12.5">embedded systems / linux / backend / telemetry / interfaces</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <path d="M804 95 L900 135 M1068 95 L972 135 M804 225 L900 185 M1068 225 L972 185" stroke="#2A3947" stroke-width="2" fill="none"/>
