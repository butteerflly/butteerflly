<svg xmlns="http://www.w3.org/2000/svg" width="580" height="536" viewBox="0 0 580 536" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">ButterFlly. From the interface to the hardware.</title>
  <desc id="desc">FRONTEND / SOFTWARE / SYSTEMS BUTTERFLLY From the interface to the hardware. I like knowing why a system behaves the way it does. LINUX / OPS EMBEDDED / IoT ENGINEERING FOCUS Signals State Feedback</desc>
