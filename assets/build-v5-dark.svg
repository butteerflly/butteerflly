<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="520" viewBox="0 0 1200 520" role="img" aria-labelledby="title desc"><title id="title">How I like to build</title><desc id="desc">Layered architecture map with principles and outcomes.</desc><rect width="1200" height="520" rx="22" fill="#0B131C"/><rect x="1" y="1" width="1198" height="518" rx="21" fill="none" stroke="#213247"/><g transform="translate(42 38)"><text x="0" y="0" dominant-baseline="hanging" fill="#8294A8" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">HOW I LIKE TO BUILD</text><text x="0" y="54" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760">Clear layers, visible state and recovery that makes sense</text><g transform="translate(44 120)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><path d="M158 26H318M414 26H574M670 26H830" stroke="#2B425B" stroke-width="2" stroke-dasharray="7 8"><animate attributeName="stroke-dashoffset" from="0" to="-30" dur="3s" repeatCount="indefinite"/></path><g><rect width="158" height="52" rx="14" fill="#132232" stroke="#263C54"/><text x="79" y="20" text-anchor="middle" fill="#8496AA" font-size="9">LAYER 01</text><text x="79" y="36" text-anchor="middle" fill="#F4F8FB" font-size="13">INTERFACES</text></g><g transform="translate(318 0)"><rect width="96" height="52" rx="14" fill="#11232B" stroke="#39E2CA" stroke-width="1.4"/><text x="48" y="20" text-anchor="middle" fill="#39E2CA" font-size="9">LAYER 02</text><text x="48" y="36" text-anchor="middle" fill="#F4F8FB" font-size="13">CONTROL</text></g><g transform="translate(574 0)"><rect width="96" height="52" rx="14" fill="#132232" stroke="#263C54"/><text x="48" y="20" text-anchor="middle" fill="#8496AA" font-size="9">LAYER 03</text><text x="48" y="36" text-anchor="middle" fill="#F4F8FB" font-size="13">SERVICES</text></g><g transform="translate(830 0)"><rect width="158" height="52" rx="14" fill="#132232" stroke="#263C54"/><text x="79" y="20" text-anchor="middle" fill="#8496AA" font-size="9">LAYER 04</text><text x="79" y="36" text-anchor="middle" fill="#F4F8FB" font-size="13">NODES + DEVICES</text></g><path d="M366 74V112M622 74V112" stroke="#2B425B" stroke-width="2"/><g transform="translate(160 112)"><rect width="388" height="110" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="28" fill="#39E2CA" font-size="10" letter-spacing="1.2">PRINCIPLE 01</text><text x="26" y="57" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">Telemetry should explain</text><text x="26" y="82" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">the system.</text><text x="26" y="101" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Failures should leave useful evidence.</text></g><g transform="translate(570 112)"><rect width="388" height="110" rx="18" fill="#101B27" stroke="#213247"/><text x="26" y="28" fill="#39E2CA" font-size="10" letter-spacing="1.2">PRINCIPLE 02</text><text x="26" y="57" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">Recovery should be designed</text><text x="26" y="82" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="21" font-weight="680">before it is needed.</text><text x="26" y="101" fill="#9EACBC" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="13.5">Boring recovery is a feature.</text></g><g transform="translate(160 246)"><rect width="388" height="72" rx="18" fill="#0F1925" stroke="#213247"/><text x="26" y="27" fill="#8496AA" font-size="9.5" letter-spacing="1.2">OUTCOME</text><text x="26" y="52" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="670">Less guesswork. Better control.</text></g><g transform="translate(570 246)"><rect width="388" height="72" rx="18" fill="#0F1925" stroke="#213247"/><text x="26" y="27" fill="#8496AA" font-size="9.5" letter-spacing="1.2">OUTCOME</text><text x="26" y="52" fill="#F4F8FB" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="20" font-weight="670">Systems that survive real use.</text></g></g></g></svg>