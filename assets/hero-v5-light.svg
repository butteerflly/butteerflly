<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="400" viewBox="0 0 1200 400" role="img" aria-labelledby="title desc"><title id="title">ButterFlly profile hero</title><desc id="desc">Software systems, embedded, IoT and automation profile hero.</desc><defs><linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#F7F9FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient><linearGradient id="accent" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#008C7A"/><stop offset="1" stop-color="#536DDA"/></linearGradient><pattern id="grid" width="30" height="30" patternUnits="userSpaceOnUse"><path d="M30 0H0V30" fill="none" stroke="#E8EDF2" stroke-width="1"/></pattern><filter id="softGlow" x="-60%" y="-60%" width="220%" height="220%"><feGaussianBlur stdDeviation="20"/></filter></defs><rect width="1200" height="400" rx="24" fill="url(#bg)"/><rect x="1" y="1" width="1198" height="398" rx="23" fill="none" stroke="#D3DBE4"/><rect width="1200" height="400" rx="24" fill="url(#grid)" opacity=".62"/><circle cx="995" cy="190" r="122" fill="#DDF6F1" opacity=".36" filter="url(#softGlow)"/><circle cx="1030" cy="140" r="76" fill="#E2E9FF" opacity=".24" filter="url(#softGlow)"/><g transform="translate(58 54)"><text x="0" y="0" dominant-baseline="hanging" fill="#596572" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="14" letter-spacing="2">BUTTERFLLY / SYSTEM PROFILE</text><rect x="0" y="31" width="122" height="3" rx="2" fill="url(#accent)"/><text x="0" y="90" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="62" font-weight="780" letter-spacing="-2.3">BUTTERFLLY</text><text x="0" y="132" fill="#5C6876" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="17" letter-spacing="1.2">SOFTWARE  ·  SYSTEMS  ·  EMBEDDED  ·  IOT  ·  AUTOMATION</text><text x="0" y="192" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="23" font-weight="680">I like systems that can explain what they are doing.</text><text x="0" y="227" fill="#586473" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Interfaces, services, Linux, device communication and realtime behavior.</text><text x="0" y="253" fill="#586473" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">State should be visible. Recovery should be planned. Complexity should stay readable.</text><g transform="translate(0 296)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12"><g><rect width="146" height="34" rx="17" fill="#FFFFFF" stroke="#D3DBE4"/><circle cx="18" cy="17" r="5" fill="#008C7A"><animate attributeName="opacity" values=".45;1;.45" dur="2.3s" repeatCount="indefinite"/></circle><text x="32" y="22" fill="#596572">PRIVATE WORKFLOW</text></g><g transform="translate(160 0)"><rect width="132" height="34" rx="17" fill="#FFFFFF" stroke="#D3DBE4"/><text x="22" y="22" fill="#596572">LINUX / OPS</text></g><g transform="translate(306 0)"><rect width="150" height="34" rx="17" fill="#FFFFFF" stroke="#D3DBE4"/><text x="22" y="22" fill="#596572">EMBEDDED / IOT</text></g></g></g><g transform="translate(770 54)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace"><rect width="372" height="292" rx="20" fill="#FFFFFF" stroke="#D3DBE4"/><text x="26" y="34" fill="#596572" font-size="11" letter-spacing="1.8">SYSTEM FOCUS</text><g transform="translate(26 68)"><path d="M78 24H147M211 24H280" stroke="#C8D3DE" stroke-width="2" stroke-dasharray="6 7"><animate attributeName="stroke-dashoffset" from="0" to="-26" dur="2.6s" repeatCount="indefinite"/></path><g><rect width="78" height="42" rx="11" fill="#F7FAFC" stroke="#D3DBE4"/><text x="39" y="26" text-anchor="middle" fill="#151B23" font-size="11">UI</text></g><g transform="translate(147 0)"><rect width="64" height="42" rx="11" fill="#F7FAFC" stroke="#008C7A" stroke-width="1.4"><animate attributeName="stroke-opacity" values=".55;1;.55" dur="2.4s" repeatCount="indefinite"/></rect><text x="32" y="17" text-anchor="middle" fill="#008C7A" font-size="8" letter-spacing="1">CORE</text><text x="32" y="29" text-anchor="middle" fill="#151B23" font-size="9.5">CONTROL</text></g><g transform="translate(280 0)"><rect width="78" height="42" rx="11" fill="#F7FAFC" stroke="#D3DBE4"/><text x="39" y="26" text-anchor="middle" fill="#151B23" font-size="11">NODES</text></g><g transform="translate(18 82)"><rect width="150" height="74" rx="14" fill="#F7FAFC" stroke="#D3DBE4"/><text x="18" y="24" fill="#008C7A" font-size="8.5" letter-spacing="1.1">PRINCIPLE 01</text><text x="18" y="47" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Make state easy</text><text x="18" y="65" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">to understand.</text></g><g transform="translate(190 82)"><rect width="150" height="74" rx="14" fill="#F7FAFC" stroke="#D3DBE4"/><text x="18" y="24" fill="#008C7A" font-size="8.5" letter-spacing="1.1">PRINCIPLE 02</text><text x="18" y="47" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">Make recovery</text><text x="18" y="65" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="14">boring on purpose.</text></g><g transform="translate(18 184)"><text x="0" y="0" dominant-baseline="hanging" fill="#596572" font-size="9.5" letter-spacing="1.3">OBSERVABLE  ·  RECOVERABLE  ·  EXPLICIT</text><rect x="0" y="28" width="322" height="10" rx="5" fill="#E7ECF2"/><rect x="0" y="28" width="220" height="10" rx="5" fill="url(#accent)"><animate attributeName="width" values="170;240;220;170" dur="5s" repeatCount="indefinite"/></rect></g></g></g></svg>