<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="430" viewBox="0 0 1200 430" role="img" aria-labelledby="title desc">
<title id="title">Home IoT project</title><desc id="desc">Distributed control plane for personal home and workshop automation.</desc>
<defs><linearGradient id="a" x1="0" x2="1"><stop stop-color="#008F82"/><stop offset="1" stop-color="#5566D9"/></linearGradient><style>.led{animation:led 2.1s ease-in-out infinite alternate}@keyframes led{from{opacity:.35}to{opacity:1}}</style></defs>
<rect width="1200" height="430" rx="20" fill="#F7F9FC"/><rect x="1" y="1" width="1198" height="428" rx="19" fill="none" stroke="#D8E1EB"/>
<g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
<text x="46" y="44" fill="#617083" font-size="11" letter-spacing="2">PROJECT / ACTIVE BUILD</text><circle cx="216" cy="40" r="4" fill="#208A62" class="led"/>
<text x="46" y="102" fill="#17202B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="48" font-weight="800" letter-spacing="-2">HOME IOT</text>
<text x="48" y="136" fill="#008F82" font-size="12" letter-spacing="1.5">PERSONAL CONTROL PLANE FOR HOME + WORKSHOP</text>
<text x="48" y="184" fill="#17202B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">One system for devices, sensors, services, telemetry,</text><text x="48" y="208" fill="#17202B" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="16">remote control, OTA updates and recovery.</text>

<g transform="translate(46 246)">
  <rect width="506" height="128" rx="14" fill="#FFFFFF" stroke="#D8E1EB"/>
  <text x="18" y="28" fill="#617083" font-size="10" letter-spacing="1.3">WHAT MATTERS MOST</text>
  <g transform="translate(18 48)"><circle cx="5" cy="6" r="4" fill="#008F82"/><text x="18" y="10" fill="#17202B" font-size="11">Know what is happening without guessing</text></g>
  <g transform="translate(18 73)"><circle cx="5" cy="6" r="4" fill="#5566D9"/><text x="18" y="10" fill="#17202B" font-size="11">Keep control when a node disappears</text></g>
  <g transform="translate(18 98)"><circle cx="5" cy="6" r="4" fill="#208A62"/><text x="18" y="10" fill="#17202B" font-size="11">Make rollback and recovery part of the design</text></g>
</g>

