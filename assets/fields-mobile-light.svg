<svg xmlns="http://www.w3.org/2000/svg" width="580" height="844" viewBox="0 0 580 844" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">Fields I work in</title>
  <desc id="desc">01 / FRONTEND Frontend engineering Web applications and control interfaces. Clear interaction, timing and feedback. 02 / EMBEDDED SYSTEMS Software near the hardware Sensors, serial buses and device logic. Where timing meets the physical world. 03 / IoT &amp; REALTIME Connected systems Device communication and realtime data. Making changing state understandable. 04 / BACKEND &amp; LINUX Services and infrastructure APIs, workers and automation. Deployment, monitoring and recovery.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#007D6C"/><stop offset="1" stop-color="#536DDA"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 5s ease-in-out infinite; }
      .flow { animation: flow 12s linear infinite; }
    }
    @keyframes pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
