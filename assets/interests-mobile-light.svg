<svg xmlns="http://www.w3.org/2000/svg" width="580" height="240" viewBox="0 0 580 240" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">Technical interests</title>
  <desc id="desc">Electronics Signals, circuits and measurement. Automotive technology Diagnostics and vehicle communication.</desc>
  <defs>
    <linearGradient id="bg" x1="0" y1="0" x2="1" y2="1"><stop stop-color="#F7F9FC"/><stop offset="1" stop-color="#FFFFFF"/></linearGradient>
    <linearGradient id="accent"><stop stop-color="#007D6C"/><stop offset="1" stop-color="#536DDA"/></linearGradient>
  </defs>
  <style>
    @media (prefers-reduced-motion: no-preference) {
      .pulse { animation: pulse 5s ease-in-out infinite; }
