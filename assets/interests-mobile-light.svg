    }
    @keyframes pulse { 0%, 100% { opacity: .65; } 50% { opacity: 1; } }
    @keyframes flow { to { stroke-dashoffset: -20; } }
  </style>
  <rect x="0.5" y="0.5" width="579" height="239" rx="16" fill="#F7F9FC" stroke="#CCD6E0"/>
  <text x="32" y="65" font-size="23" fill="#151B23" font-weight="600">Electronics</text>
  <text x="32" y="97" font-size="19" fill="#526171" font-weight="400">Signals, circuits and measurement.</text>
  <text x="32" y="153" font-size="23" fill="#151B23" font-weight="600">Automotive technology</text>
  <text x="32" y="185" font-size="19" fill="#526171" font-weight="400">Diagnostics and vehicle communication.</text>
</svg>
