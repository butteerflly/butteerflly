<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="330" viewBox="0 0 1200 330" role="img" aria-labelledby="title desc"><title id="title">Engineering overview</title><desc id="desc">Three large balanced cards describing work areas, approach and privacy.</desc><rect width="1200" height="330" rx="22" fill="#FFFFFF"/><rect x="1" y="1" width="1198" height="328" rx="21" fill="none" stroke="#D3DBE4"/><g transform="translate(42 38)"><text x="0" y="0" dominant-baseline="hanging" fill="#596572" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">ENGINEERING PROFILE</text><text x="0" y="54" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760">The work matters more than the buzzwords</text><g transform="translate(0 106)"><g><rect width="356" height="164" rx="18" fill="#F7FAFC" stroke="#D3DBE4"/><text x="24" y="30" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">WHAT I WORK WITH</text><text x="24" y="64" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="730">Systems across layers</text><text x="24" y="98" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Embedded, backend, Linux, interfaces,</text><text x="24" y="121" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">networked nodes and realtime telemetry.</text><text x="24" y="144" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">I like the boundaries between them.</text></g><g transform="translate(378 0)"><rect width="356" height="164" rx="18" fill="#F7FAFC" stroke="#D3DBE4"/><text x="24" y="30" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">HOW I APPROACH IT</text><text x="24" y="64" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="730">Clarity before cleverness</text><text x="24" y="98" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Explicit state, useful telemetry, simple</text><text x="24" y="121" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">control paths and recovery planned early.</text><text x="24" y="144" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Hidden magic ages badly.</text></g><g transform="translate(756 0)"><rect width="360" height="164" rx="18" fill="#F7FAFC" stroke="#D3DBE4"/><text x="24" y="30" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">PUBLIC PROFILE</text><text x="24" y="64" fill="#151B23" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="28" font-weight="730">Privacy is intentional</text><text x="24" y="98" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">This is not a live project log.</text><text x="24" y="121" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">I show the kind of problems I work on,</text><text x="24" y="144" fill="#596572" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">not the private details behind them.</text></g></g></g></svg>