<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="340" viewBox="0 0 1200 340" role="img" aria-labelledby="title desc">
  <title id="title">ButterFlly profile header</title>
  <desc id="desc">Software, systems, embedded, IoT and automation profile header.</desc>
  <defs>
    <pattern id="grid" width="32" height="32" patternUnits="userSpaceOnUse"><path d="M32 0H0V32" fill="none" stroke="#E5EAEE" stroke-width="1"/></pattern>
    <linearGradient id="line" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#008C7A"/><stop offset="1" stop-color="#4E64C8"/></linearGradient>
    <filter id="glow" x="-30%" y="-30%" width="160%" height="160%"><feGaussianBlur stdDeviation="14"/></filter>
  </defs>
  <rect width="1200" height="340" rx="24" fill="#F6F8FA"/>
  <rect x="1" y="1" width="1198" height="338" rx="23" fill="none" stroke="#D0D7DE"/>
  <rect width="1200" height="340" rx="24" fill="url(#grid)" opacity="0.72"/>
  <circle cx="950" cy="170" r="112" fill="#D9F5F1" opacity="0.50" filter="url(#glow)"/>
  <text x="58" y="54" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="13" letter-spacing="2.4">BUTTERFLLY / SYSTEM PROFILE</text>
  <rect x="58" y="74" width="112" height="3" rx="2" fill="url(#line)"/>
  <text x="56" y="137" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="61" font-weight="770" letter-spacing="-2.8">BUTTERFLLY</text>
  <text x="58" y="177" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="16" letter-spacing="1.35">SOFTWARE  ·  SYSTEMS  ·  EMBEDDED  ·  IOT  ·  AUTOMATION</text>
  <text x="58" y="216" fill="#161B22" opacity="0.92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">Software that connects services, infrastructure,</text>
  <text x="58" y="241" fill="#161B22" opacity="0.92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="17">devices and real world systems.</text>
  <g transform="translate(58 271)"><rect width="176" height="34" rx="17" fill="#FFFFFF" stroke="#D0D7DE"/><circle cx="19" cy="17" r="5" fill="#008C7A"/><text x="34" y="22" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="11.5" letter-spacing="0.8">PRIVATE WORKFLOW</text></g>
  <text x="252" y="293" fill="#161B22" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12">embedded / linux / backend / telemetry / interfaces</text>
  <g font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="950" y="49" text-anchor="middle" fill="#57606A" font-size="10" letter-spacing="1.15">OBSERVABLE / RECOVERABLE / BUILT TO LAST</text>
    <path d="M816 111 L908 147 M1084 111 L992 147 M816 229 L908 193 M1084 229 L992 193" stroke="#C6D0DA" stroke-width="2" fill="none"/>
    <g transform="translate(900 141)"><rect width="100" height="62" rx="14" fill="#FFFFFF" stroke="#008C7A" stroke-width="1.5"/><text x="50" y="27" text-anchor="middle" fill="#008C7A" font-size="10" letter-spacing="1.3">CONTROL</text><text x="50" y="45" text-anchor="middle" fill="#161B22" font-size="14" font-weight="700">CORE</text></g>
    <g transform="translate(742 82)"><rect width="154" height="54" rx="13" fill="#F8FAFB" stroke="#D0D7DE"/><circle cx="20" cy="27" r="5" fill="#4E64C8"/><text x="36" y="27" fill="#161B22" font-size="13">WEB / UI</text><text x="36" y="43" fill="#57606A" font-size="10">operator views</text></g>
    <g transform="translate(1004 82)"><rect width="154" height="54" rx="13" fill="#F8FAFB" stroke="#D0D7DE"/><circle cx="20" cy="27" r="5" fill="#008C7A"/><text x="36" y="27" fill="#161B22" font-size="13">LINUX NODES</text><text x="36" y="43" fill="#57606A" font-size="10">services and ops</text></g>
    <g transform="translate(742 214)"><rect width="154" height="54" rx="13" fill="#F8FAFB" stroke="#D0D7DE"/><circle cx="20" cy="27" r="5" fill="#008C7A"/><text x="36" y="27" fill="#161B22" font-size="13">EMBEDDED</text><text x="36" y="43" fill="#57606A" font-size="10">sensors and control</text></g>
    <g transform="translate(1004 214)"><rect width="154" height="54" rx="13" fill="#F8FAFB" stroke="#D0D7DE"/><circle cx="20" cy="27" r="5" fill="#4E64C8"/><text x="36" y="27" fill="#161B22" font-size="13">REALTIME</text><text x="36" y="43" fill="#57606A" font-size="10">telemetry and state</text></g>
  </g>
</svg>
