<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="302" viewBox="0 0 1200 302" role="img" aria-labelledby="title desc">
  <title id="title">Engineering console</title>
  <desc id="desc">A privacy friendly console summarizing work areas, style and approach.</desc>
  <defs><linearGradient id="bar" x1="0" x2="1"><stop stop-color="#45E6D2"/><stop offset="1" stop-color="#7C93FF"/></linearGradient><style>.pulse{animation:pulse 2.8s ease-in-out infinite alternate}@keyframes pulse{from{opacity:.45}to{opacity:1}}</style></defs>
  <rect width="1200" height="302" rx="20" fill="#0C1117"/>
  <rect x="1" y="1" width="1198" height="300" rx="19" fill="none" stroke="#26313E"/>
  <g transform="translate(32 27)" font-family="ui-monospace,SFMono-Regular,Consolas,monospace">
    <text x="0" y="0" fill="#8B98A8" font-size="12" letter-spacing="2" dominant-baseline="hanging">ENGINEERING CONSOLE</text>
    <rect x="0" y="24" width="140" height="3" rx="2" fill="url(#bar)"/>
    <g transform="translate(0 56)">
      <rect width="536" height="184" rx="16" fill="#111820" stroke="#26313E"/>
      <text x="22" y="31" fill="#45E6D2" font-size="11" letter-spacing="1.4">WORK AREAS</text>
      <text x="22" y="62" fill="#EDF2F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">What I work with</text>
      <g transform="translate(22 88)">
        <rect width="146" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="73" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">embedded systems</text>
        <g transform="translate(158 0)"><rect width="104" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="52" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">linux</text></g>
        <g transform="translate(274 0)"><rect width="112" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="56" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">backend</text></g>
        <g transform="translate(398 0)"><rect width="112" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="56" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">realtime</text></g>
        <g transform="translate(0 45)"><rect width="122" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="61" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">telemetry</text></g>
        <g transform="translate(134 45)"><rect width="126" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="63" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">automation</text></g>
        <g transform="translate(272 45)"><rect width="116" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="58" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">interfaces</text></g>
        <g transform="translate(400 45)"><rect width="110" height="32" rx="8" fill="#0D141B" stroke="#26313E"/><text x="55" y="21" text-anchor="middle" fill="#8B98A8" font-size="11">networks</text></g>
      </g>
    </g>
    <g transform="translate(556 56)">
      <rect width="264" height="184" rx="16" fill="#111820" stroke="#26313E"/>
      <text x="22" y="31" fill="#45E6D2" font-size="11" letter-spacing="1.4">WORK STYLE</text>
      <text x="22" y="62" fill="#EDF2F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">How I think</text>
      <text x="22" y="101" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Clear state</text>
      <text x="22" y="125" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Useful telemetry</text>
      <text x="22" y="149" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Recovery paths</text>
      <text x="22" y="173" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Clear boundaries</text>
    </g>
    <g transform="translate(840 56)">
      <rect width="328" height="184" rx="16" fill="#111820" stroke="#26313E"/>
      <text x="22" y="31" fill="#45E6D2" font-size="11" letter-spacing="1.4">PROFILE NOTES</text>
      <text x="22" y="62" fill="#EDF2F7" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="27" font-weight="720">Privacy first</text>
      <text x="22" y="101" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">Active project details stay private.</text>
      <text x="22" y="126" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">This profile shows fields and skills,</text>
      <text x="22" y="149" fill="#EDF2F7" opacity=".92" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="15">not a live project log.</text>
      <g transform="translate(22 163)"><rect width="138" height="9" rx="4.5" fill="#1A2631"/><rect class="pulse" width="98" height="9" rx="4.5" fill="url(#bar)"/></g>
    </g>
  </g>
</svg>
