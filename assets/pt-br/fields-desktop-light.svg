<svg xmlns="http://www.w3.org/2000/svg" width="900" height="356" viewBox="0 0 900 356" xml:lang="pt-BR" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">Áreas de atuação</title>
  <desc id="desc">01 / INTERFACES Engenharia de frontend Interação, estado da aplicação e layouts responsivos. 02 / SOFTWARE Serviços e automação APIs, tarefas em segundo plano e serviços Linux. 03 / HARDWARE Sistemas embarcados Firmware, sensores e comunicação serial. 04 / CONECTIVIDADE IoT e tempo real Integração de dispositivos, telemetria e troca de mensagens.</desc>
