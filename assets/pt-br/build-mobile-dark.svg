<svg xmlns="http://www.w3.org/2000/svg" width="580" height="366" viewBox="0 0 580 366" xml:lang="pt-BR" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">Como gosto de trabalhar</title>
  <desc id="desc">01 Deixar o estado claro Carregamento, dados desatualizados e erros precisam ficar visíveis. 02 Testar quando as coisas falham Verificar atrasos, novas tentativas e perda de conexão. 03 Facilitar a recuperação Manter logs úteis e um caminho para reverter mudanças.</desc>
  <text x="32" y="46" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">01</text>
  <text x="78" y="46" font-size="23" fill="#F2F1ED" font-weight="600">Deixar o estado claro</text>
  <text x="78" y="78" font-size="21" fill="#ACB7B8" font-weight="400">Carregamento, dados desatualizados</text>
  <text x="78" y="106" font-size="21" fill="#ACB7B8" font-weight="400">e erros precisam ficar visíveis.</text>
  <path d="M78 121H548" fill="none" stroke="#304044" />
  <text x="32" y="164" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">02</text>
  <text x="78" y="164" font-size="23" fill="#F2F1ED" font-weight="600">Testar quando as coisas falham</text>
  <text x="78" y="196" font-size="21" fill="#ACB7B8" font-weight="400">Verificar atrasos, novas tentativas</text>
  <text x="78" y="224" font-size="21" fill="#ACB7B8" font-weight="400">e perda de conexão.</text>
  <path d="M78 239H548" fill="none" stroke="#304044" />
  <text x="32" y="282" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">03</text>
  <text x="78" y="282" font-size="23" fill="#F2F1ED" font-weight="600">Facilitar a recuperação</text>
  <text x="78" y="314" font-size="21" fill="#ACB7B8" font-weight="400">Manter logs úteis e um caminho</text>
  <text x="78" y="342" font-size="21" fill="#ACB7B8" font-weight="400">para reverter mudanças.</text>
</svg>
