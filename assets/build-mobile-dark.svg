<svg xmlns="http://www.w3.org/2000/svg" width="580" height="340" viewBox="0 0 580 340" role="img" aria-labelledby="title desc" fill="none" font-family="Arial, Helvetica, sans-serif" stroke-width="1">
  <title id="title">How I like to build</title>
  <desc id="desc">01 Make state visible Show loading, stale data and errors clearly. 02 Test beyond the happy path Check timing, retries and lost connections. 03 Keep changes recoverable Leave useful logs and a practical rollback path.</desc>
  <text x="32" y="58" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">01</text>
  <text x="78" y="58" font-size="23" fill="#F2F1ED" font-weight="600">Make state visible</text>
  <text x="78" y="90" font-size="21" fill="#ACB7B8" font-weight="400">Show loading, stale data and errors clearly.</text>
  <path d="M78 114H548" fill="none" stroke="#304044" />
  <text x="32" y="158" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">02</text>
  <text x="78" y="158" font-size="23" fill="#F2F1ED" font-weight="600">Test beyond the happy path</text>
  <text x="78" y="190" font-size="21" fill="#ACB7B8" font-weight="400">Check timing, retries and lost connections.</text>
  <path d="M78 214H548" fill="none" stroke="#304044" />
  <text x="32" y="258" font-size="16" fill="#CCA17F" font-weight="400" font-family="Consolas,'Liberation Mono',monospace">03</text>
  <text x="78" y="258" font-size="23" fill="#F2F1ED" font-weight="600">Keep changes recoverable</text>
  <text x="78" y="290" font-size="21" fill="#ACB7B8" font-weight="400">Leave useful logs and a practical rollback path.</text>
</svg>
