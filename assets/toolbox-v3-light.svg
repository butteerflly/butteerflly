<svg xmlns="http://www.w3.org/2000/svg" width="1200" height="350" viewBox="0 0 1200 350" role="img" aria-labelledby="title desc">
  <title id="title">Engineering toolbox</title><desc id="desc">A grouped view of the main technologies used.</desc>
  <rect width="1200" height="350" rx="20" fill="#FFFFFF"/><rect x="1" y="1" width="1198" height="348" rx="19" fill="none" stroke="#D0D7DE"/>
  <text x="42" y="50" fill="#57606A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="12" letter-spacing="2">TOOLBOX</text>
  <text x="42" y="100" fill="#161B22" font-family="Inter,Segoe UI,Arial,sans-serif" font-size="40" font-weight="760" letter-spacing="-1.2">The stack changes with the problem</text>
  <g transform="translate(42 140)" font-family="Inter,Segoe UI,Arial,sans-serif">
    <g><rect width="270" height="164" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="31" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">SYSTEMS + BACKEND</text><text x="20" y="67" fill="#161B22" font-size="18" font-weight="700">Go · C# · .NET · Node.js</text><text x="20" y="98" fill="#57606A" font-size="15">APIs, workers, services,</text><text x="20" y="120" fill="#57606A" font-size="15">automation, transport</text><text x="20" y="142" fill="#57606A" font-size="15">and state.</text></g>
    <g transform="translate(288 0)"><rect width="270" height="164" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="31" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">FRONTEND</text><text x="20" y="67" fill="#161B22" font-size="18" font-weight="700">TypeScript · React · Vite</text><text x="20" y="98" fill="#57606A" font-size="15">Interfaces, dashboards,</text><text x="20" y="120" fill="#57606A" font-size="15">operator views and</text><text x="20" y="142" fill="#57606A" font-size="15">web tooling.</text></g>
    <g transform="translate(576 0)"><rect width="270" height="164" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="31" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">EMBEDDED + IOT</text><text x="20" y="67" fill="#161B22" font-size="18" font-weight="700">ESP32 · UART · I²C · OTA</text><text x="20" y="98" fill="#57606A" font-size="15">Firmware, sensors,</text><text x="20" y="120" fill="#57606A" font-size="15">integration and</text><text x="20" y="142" fill="#57606A" font-size="15">field behavior.</text></g>
    <g transform="translate(864 0)"><rect width="270" height="164" rx="14" fill="#F6F8FA" stroke="#D0D7DE"/><text x="20" y="31" fill="#008C7A" font-family="ui-monospace,SFMono-Regular,Consolas,monospace" font-size="10" letter-spacing="1.4">INFRA + OPS</text><text x="20" y="65" fill="#161B22" font-size="17" font-weight="700">Linux · Docker · Prometheus</text><text x="20" y="87" fill="#161B22" font-size="17" font-weight="700">GitHub Actions</text><text x="20" y="116" fill="#57606A" font-size="15">Ops, observability,</text><text x="20" y="138" fill="#57606A" font-size="15">delivery and recovery.</text></g>
  </g>
</svg>
