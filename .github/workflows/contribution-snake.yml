name: Generate contribution activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#536DDA&color_dots=#F6F8FA,#D9F3EF,#9DDFD4,#43BBAA,#008C7A
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#718BFF&color_dots=#0B131C,#12302F,#18504C,#248379,#39E2CA

      - name: Publish generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
