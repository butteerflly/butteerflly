name: Generate contribution activity

on:
  schedule:
    - cron: "17 3 * * *"
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/contribution-snake.yml"

permissions:
  contents: write

jobs:
  generate:
    runs-on: ubuntu-latest
    timeout-minutes: 5

    steps:
      - name: Generate contribution SVGs
        uses: Platane/snk/svg-only@v3
        with:
          github_user_name: ${{ github.repository_owner }}
          outputs: |
            dist/github-contribution-grid-snake.svg?palette=github-light&color_snake=#89603F&color_dots=#F7F8F6,#E1EFE8,#B1D4C5,#6DAF94,#236E5C
            dist/github-contribution-grid-snake-dark.svg?palette=github-dark&color_snake=#CCA17F&color_dots=#111719,#20312F,#2B5048,#4A8273,#80C9B8

      - name: Publish generated assets to output branch
        uses: crazy-max/ghaction-github-pages@v3.1.0
        with:
          target_branch: output
          build_dir: dist
        env:
          GITHUB_TOKEN: ${{ secrets.GITHUB_TOKEN }}
